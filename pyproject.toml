[project]
name = "ha-base-power"
version = "0.1.0"
description = "Home Assistant integration for Base Power home batteries"
requires-python = ">=3.12"

# The integration itself declares no requirements (manifest.json): the API is
# Connect RPC, whose JSON codec needs no protobuf runtime, and the HTTP client
# is the aiohttp session Home Assistant provides. These are for the tests only.
[dependency-groups]
# Runs anywhere, including Windows: enough for the tests/ suite and the
# fallback mypy config below.
dev = ["pytest", "pytest-asyncio", "mypy"]
# The full suite. Linux only, and note the interpreter: every
# pytest-homeassistant-custom-component from 0.13.317 requires Python >=3.14,
# so on 3.13 pip silently resolves an OLD Home Assistant rather than refusing,
# and you test against the wrong version without being told. 0.13.365 is Home
# Assistant 2026.9.2, the version this runs on.
ha = ["pytest-homeassistant-custom-component==0.13.365", "mypy==1.18.2"]

# THIS IS THE FALLBACK CONFIG, not the real check.
#
# The check that counts runs on Linux with homeassistant installed and covers
# all eleven modules:
#
#     mypy --strict custom_components/base_power
#
# What is configured below is the most that can be checked on a host WITHOUT
# Home Assistant, which will not install on Windows (it needs fcntl). Four
# modules, with the HA-facing ones silenced by name because their errors there
# are missing-stub artefacts rather than findings. A green run from this config
# says nothing about the other seven.
[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "custom_components/base_power/api.py",
    "custom_components/base_power/clerk.py",
    "custom_components/base_power/clerk_signin.py",
    "custom_components/base_power/const.py",
]
# Without homeassistant installed these resolve to nothing and every base
# class becomes Any. Silencing the import errors keeps the four modules above
# readable; it does not make the HA layer checked.
[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true

# The package __init__ imports the HA-facing modules, so mypy pulls them in
# whether or not they are listed above. Every error it reports in them HERE is
# an artefact of homeassistant being absent - a base class that degraded to
# Any, and returns inferred from it - not a finding.
#
# These modules ARE checked, properly, by the Linux command at the top of this
# section: all eleven pass --strict against Home Assistant 2026.9.2. This block
# only stops a Windows run from drowning in noise it cannot act on. It is the
# reason the HA layer reads green from THIS config, so never read a pass here
# as coverage of those seven modules.
[[tool.mypy.overrides]]
module = [
    "base_power",
    "base_power.coordinator",
    "base_power.config_flow",
    "base_power.sensor",
    "base_power.binary_sensor",
    "base_power.entity",
    "base_power.diagnostics",
]
ignore_errors = true

[tool.pytest.ini_options]
# The Clerk sign-in and API clients are async, and their tests are plain async
# functions rather than each carrying a marker.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated artwork, and the generator that writes it. Neither is shipped
# code and the generator is maintained alongside the images, not here.
extend-exclude = ["custom_components/base_power/brand", "brand"]

# The same rule set the sibling integrations lint against. Kept identical on
# purpose: one forge runner lints all of them, and a rule that is on in one
# repo and off in the next is a rule nobody trusts. Only line-length and
# target-version differ, because this code was written to 100 and 3.12.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Every test loads the integration by path so it can run without Home
# Assistant installed, which necessarily puts imports after code.
"tests/*" = ["E402"]
