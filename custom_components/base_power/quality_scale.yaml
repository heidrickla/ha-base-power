# Status is what was observed, with the date. Anything provable only by
# execution says which run proved it.
#
# Verified 2026-09-13 against Home Assistant 2026.9.2: 136 tests, 96% coverage,
# mypy --strict clean on all 11 modules, entry loaded with nine entities.
#
# The manifest declares no quality_scale key on purpose: a custom integration
# does not get a badge.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      No actions of its own. The two control methods the API exposes
      (StartManualBackup, ResetOvercurrent) act on real hardware and are
      deliberately not wired to anything yet.
  appropriate-polling:
    status: done
    comment: |
      Thirty seconds, chosen against evidence rather than taste. The app's
      own refetchInterval is 1000 ms, read out of the bundle, but React Query
      only refetches while its screen is mounted and focused - a burst while
      somebody watches, not a standing load. A 24/7 poller at that rate would
      be 86,400 calls a day against Base's production service. 30 s is ~2,880
      and still responsive enough for the outage sensor, which is the point
      of the integration. The floor on the user-configurable interval is 15 s
      for the same reason.
  brands:
    status: done
    comment: |
      Six images under brand/ here in the integration directory: icon 256x256,
      icon@2x 512x512, logo and dark_logo 512x256 with @2x at 1024x512. Home
      Assistant serves them from there at /api/brands/integration/base_power/,
      which takes priority over the CDN, so nothing needs submitting to
      home-assistant/brands for these to appear.

      Confirmed serving by BYTE COMPARISON, not status code, with two other
      integrations as controls on the same call. That distinction is the whole
      finding: brands.home-assistant.io answers 200 for a domain it has never
      heard of, returning a 3039-byte "icon not available" placeholder. A
      status-code check reports success while the user still sees a grey box.
  common-modules:
    status: done
    comment: |
      coordinator.py holds the coordinator, entity.py the base every entity
      shares (device info, availability rule), so the two platforms differ
      only in what they read off the snapshot.
  config-flow-test-coverage:
    status: done
    comment: |
      config_flow.py: 129 statements, 0 missed, 100%.

      32 tests in tests/ha/test_config_flow.py, mostly error branches. This is
      the one part a user drives by hand, and its failures are expensive:
      requesting a code sends a real email, and a wrong-code path that
      re-requests will rate-limit the account.

      Pinned, beyond each step succeeding:

      - a wrong code re-shows the same screen, so a retry does not request a
        second code
      - an expired or rate-limited code returns to the email step, because
        retyping a dead code cannot work
      - each Clerk failure maps to its own message: unknown_email,
        code_expired, too_many_requests, signin_failed, unknown. They tell the
        user different things to do.
      - invalid_auth against cannot_connect, which decides whether someone
        re-copies a credential or waits for Base to come back
      - a valid credential on an account with no sites is no_locations, not an
        auth failure
      - a second entry for the same address id aborts as already_configured
      - reauth reuses the stored email, and asks for one on an entry created
        before it was stored
      - the options flow refuses an interval outside 15-3600
  config-flow:
    status: done
    comment: |
      A menu, then email, then code: the integration performs Clerk's
      passwordless sign-in itself rather than asking anyone to copy a cookie.
      The credential is validated by a real ListLocations call before the
      entry is created, and the site is discovered from that response rather
      than typed. A pasted credential remains as a demoted second option for
      social-only and two-factor accounts.
  dependency-transparency:
    status: done
    comment: |
      No requirements at all. The API is Connect RPC, whose JSON codec means
      no protobuf runtime is needed, and the client is built on the aiohttp
      session Home Assistant provides.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description:
    status: done
    comment: README.md says what it is and what it talks to.
  docs-installation-instructions:
    status: done
    comment: |
      README has a Setting it up section: add the integration, choose the
      emailed code, enter the address, enter the code. The fallback paste
      path is described as a fallback and says when it is needed.
  docs-removal-instructions:
    status: done
    comment: |
      README says how to delete the entry, what that does and does not
      affect, and how to revoke the session at Base as well.
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup:
    status: exempt
    comment: |
      Nothing subscribes to events: the coordinator polls and entities read
      from it.
  entity-unique-id:
    status: done
    comment: |
      Every entity is `<address_id>_<key>`, and the address id is the
      identifier the whole API is scoped by.
  has-entity-name:
    status: done
  runtime-data:
    status: done
    comment: |
      The coordinator lives on entry.runtime_data, typed through
      BasePowerConfigEntry.
  test-before-configure:
    status: done
    comment: |
      The config flow calls ListLocations before creating the entry, so a bad
      credential or an unreachable API is reported in the form rather than as
      a broken entry.
  test-before-setup:
    status: done
    comment: |
      async_config_entry_first_refresh, and a rejected credential raises
      ConfigEntryAuthFailed into the reauth flow.
  unique-config-entry:
    status: done
    comment: The address id is the unique id, so a site cannot be added twice.

  # Silver
  action-exceptions:
    status: exempt
    comment: No actions.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: done
    comment: |
      README documents the one option - poll interval, its default, floor and
      ceiling, and that changing it reloads the entry.
  docs-installation-parameters:
    status: done
    comment: |
      README's Setting it up section documents everything a user supplies:
      the email address on the Base account and the six-digit code, which is
      all the normal path asks for. The fallback path's one parameter - the
      __client cookie - is documented with where to find it and which cookie
      it is NOT (__session, which expires in about a minute). Nothing else is
      entered: the site and its address id are discovered.
  entity-unavailable:
    status: done
    comment: |
      Entities go unavailable when the poll fails and when the API answers
      telemetry_unavailable - the service saying it has no current reading.
      Holding the last value through either would show a stale number as
      current. The battery_state sensor is the deliberate exception: its job
      is to say why the others went away.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: |
      DataUpdateCoordinator already logs a failing poll. What it cannot log
      is the case that actually happens here: the poll SUCCEEDS and the
      battery is simply not reporting, which takes almost every entity
      unavailable while the logs stay silent and the integration looks
      broken. The coordinator now says so once per transition - naming the
      state and the battery Wi-Fi status, and saying the connection to Base
      is fine - and once more when telemetry returns. Once per transition,
      not per poll: at 30 s that would be 2,880 identical lines a day.
  parallel-updates:
    status: done
    comment: |
      PARALLEL_UPDATES = 0 on both platforms: everything is read from the
      coordinator and nothing calls the API per entity.
  reauthentication-flow:
    status: done
    comment: |
      A Clerk session can end or be revoked, which is the expected way this
      breaks. Reauth re-runs the same emailed-code sign-in, pre-filled from
      the address stored in entry.data, and falls back to asking for the
      address when an older entry has none. The new credential is validated
      before it replaces the stored one.
  test-coverage:
    status: done
    comment: |
      136 tests, 96% of the component, against Home Assistant 2026.9.2.

        __init__      100%   config_flow   100%   entity      100%
        binary_sensor 100%   const         100%   clerk       100%
        sensor         98%   coordinator    94%   clerk_signin 96%
        diagnostics    89%   api            88%

      The remainder in api.py is the HTTP transport, exercised live rather
      than mocked.

      Two suites, separate on purpose. tests/ imports the parsing layer by
      path and runs with no Home Assistant installed. That is the check, not a
      Windows workaround: if an HA import reaches api.py or clerk.py, that
      suite stops running. tests/ha needs a real Home Assistant; the root
      conftest skips it when the harness is absent and prints which half ran,
      so a partial run is not mistaken for a full one.

      tests/ha mostly pins absence, where a wrong guess is invisible:

      - no telemetry makes every value entity unavailable while battery_state
        stays available to say why
      - no solar sensor is created on a site without solar
      - state_of_charge is unknown while on grid
      - a failed poll goes unavailable rather than holding a stale kW figure
      - the repair issue waits the full 30 minutes, driven by real polls at
        the real interval. The threshold is a duration converted to a poll
        count, so one clock jump is one poll, not sixty.
      - diagnostics carry no credential, no SSID and no address id, checked
        through the endpoint a user downloads
      - an interval below the floor is raised to it even if .storage is edited
        by hand
      - a negative from_storage reaches a sensor at -0.3 kW, so the signed
        sensor is not clamping

      Not covered by tests: the three live cross-checks in docs/API.md. Tests
      prove the code does what it means to; only the live comparison proves
      the contract was read correctly.

  # Gold
  devices:
    status: done
    comment: One device per site.
  diagnostics:
    status: done
    comment: |
      Credentials are absent rather than masked, the address id appears only
      as a digest, and the Wi-Fi SSID never appears; the snapshot dataclass
      keeps no raw response, so there is none to leak. Pinned by tests.
  discovery-update-info:
    status: exempt
    comment: Cloud service, nothing to discover on the network.
  discovery:
    status: exempt
    comment: |
      The API is reached over the internet and scoped by an account
      credential; there is nothing discoverable.
  docs-data-update:
    status: done
    comment: |
      README has a How data updates section: cloud polling, the interval and
      why it is not the app's 1 s, and the two conditions that make entities
      unavailable.
  docs-examples:
    status: done
    comment: |
      Two worked examples in the README - an outage notification and a
      template sensor for charge/discharge direction.
  docs-known-limitations:
    status: done
    comment: |
      docs/API.md is explicit about them: no state of charge while on grid,
      UsageService returning no samples for the site tested, and the entities
      that need a grid outage before they carry a value.
  docs-supported-devices:
    status: done
    comment: |
      README says one device per site, discovered rather than entered, and
      that it is cloud-only with no local path to the battery.
  docs-supported-functions:
    status: done
    comment: README lists the entities and says which are deliberately absent.
  docs-troubleshooting:
    status: done
    comment: |
      README has a troubleshooting table covering the two readings that look
      like faults and are not (state of charge unknown on grid, no solar
      sensor), the unavailability cases, and each sign-in failure.
  docs-use-cases:
    status: done
    comment: README lists four, led by the outage sensor.
  dynamic-devices:
    status: exempt
    comment: |
      A site's battery does not come and go; a second site is a second entry.
  entity-category:
    status: done
    comment: |
      The Wi-Fi SSID sensor is DIAGNOSTIC and disabled by default. The power
      and state entities are primary.
  entity-device-class:
    status: done
    comment: |
      POWER, ENERGY_STORAGE, BATTERY, DURATION and ENUM on the sensors;
      PROBLEM on both binary sensors.
  entity-disabled-by-default:
    status: done
    comment: The Wi-Fi SSID sensor, which is rarely wanted.
  entity-translations:
    status: done
    comment: |
      Every entity has a translation key, and battery_state translates its
      states. "unknown" is deliberately NOT among the ENUM options: it is a
      reserved Home Assistant state, so the decoder's unknown maps to None.
  exception-translations:
    status: done
    comment: |
      ConfigEntryAuthFailed and UpdateFailed are raised with
      translation_domain and translation_key rather than f-strings, so the
      text a user sees on the integration card is translatable and the
      underlying error arrives as a placeholder.

      validate_local.py enforces the three ways this drifts silently: a key
      raised but not declared renders as the bare key, a key declared but
      never raised is dead text, and a placeholder no raise site supplies is
      a KeyError inside Home Assistant's own formatting. Each half was proven
      to fail on a deliberately broken copy rather than assumed to work.
  icon-translations:
    status: done
    comment: |
      icons.json covers every entity, and battery_state carries a per-state
      icon so the operating state is legible at a glance - a tower for on
      grid, a struck-through tower for an outage, a flash-alert for
      overcurrent.
  reconfiguration-flow:
    status: exempt
    comment: |
      There is nothing a reconfigure flow could change. The only value in
      entry.data that a user supplied is the credential, and replacing that
      is precisely the reauthentication flow, which exists and re-runs the
      same emailed-code sign-in. The address id is discovered rather than
      entered, so it cannot be edited into something else meaningfully - a
      different site is a different entry, guarded by the unique id. The poll
      interval is an option, and options already have their own flow.

      Marked exempt rather than todo because this is not deferred work: a
      reconfigure step here would either duplicate reauth or offer to edit a
      value the integration derives for itself.
  repair-issues:
    status: done
    comment: |
      A telemetry_unavailable repair issue, which is Home Assistant's form of
      the banner Base's own app shows for the same condition. It explains
      what the state means, that backup during a grid outage is unaffected,
      that the unavailable entities are deliberate, and that Home Assistant
      cannot fix it - the gap is between the battery and Base.

      Not raised on a single quiet poll: the threshold is a five-minute grace
      period converted to polls against whatever interval is configured, so a
      blip does not raise and clear a repair twice a minute and a user on a
      long interval does not wait hours. Cleared unconditionally on recovery
      rather than only on an observed transition, and re-created while the
      condition persists, so it survives a restart in both directions.

      The credential expiring is still a reauth flow rather than a repair.
  stale-devices:
    status: exempt
    comment: One device per entry; removing the entry removes it.

  # Platinum
  async-dependency:
    status: done
    comment: |
      No dependency at all: the client is async over Home Assistant's own
      aiohttp session.
  inject-websession:
    status: done
    comment: |
      async_get_clientsession throughout - the client, the config flow and
      the Clerk provider all take the shared session.
  strict-typing:
    status: done
    comment: |
      `mypy --strict` passes on all 11 modules, with Home Assistant installed
      so its types actually resolve:

        mypy==1.18.2 --strict custom_components/base_power

      The gate is verified non-vacuous in both halves: a planted
      `def f(x: int) -> str: return x` is caught in api.py and in
      coordinator.py.

      Fourteen errors found and fixed. Eleven in the pure layer: ten
      possibly-None dict walks in api.py and an Any-return in clerk_signin.py.
      One of those was a live crash, where a wrongly typed `battery` key
      raised AttributeError through LocationCapabilities.from_json, which runs
      at setup, so the entry would never finish loading. Three in the HA
      layer: __init__ signatures in sensor.py and binary_sensor.py missing the
      annotations their base class already had.

      Requires Linux with homeassistant installed; Home Assistant needs fcntl
      and will not install on Windows. The interpreter constraint fails
      silently: every pytest-homeassistant-custom-component from 0.13.317
      requires Python >=3.14, so on 3.13 pip resolves an old Home Assistant
      instead of refusing.

      pyproject.toml carries a narrower mypy config for Windows: four modules,
      with the HA-facing ones silenced by name. The command above is the one
      that covers everything.
