name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The forge runs these jobs too. Its runner has no ubuntu-26.04 label, its
# setup-python toolcache is shared with other repositories (so installs go
# into a venv), and it ignores a job's timeout-minutes (so steps carry one).
#
# Two environments on purpose. The pure suite runs with NO Home Assistant and
# no third-party runtime package installed, which is the check: if an import
# from either reaches api.py or clerk.py it stops collecting and says so. A
# single environment would hide that.
jobs:
  pure:
    name: Parsing layer, without Home Assistant
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        timeout-minutes: 10
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet pytest pytest-asyncio ruff

      - name: Ruff
        timeout-minutes: 5
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .

      - name: Pure tests
        timeout-minutes: 10
        run: .venv/bin/python -m pytest tests -q

      - name: Offline validator
        timeout-minutes: 5
        run: .venv/bin/python tools/validate_local.py

  home-assistant:
    name: Home Assistant layer
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.14 is required, not preferred. Every
      # pytest-homeassistant-custom-component from 0.13.317 needs >=3.14, and
      # on 3.13 pip resolves an OLD Home Assistant instead of refusing, so the
      # suite goes green against a version nobody runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        timeout-minutes: 15
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet \
            "pytest-homeassistant-custom-component==0.13.365" \
            "mypy==1.18.2"

      - name: Full suite with coverage
        timeout-minutes: 15
        run: |
          .venv/bin/python -m pytest tests -q \
            --cov=custom_components/base_power \
            --cov-report=term-missing --cov-fail-under=95

      # mypy-full.ini, not pyproject's [tool.mypy]. That section is the
      # Windows fallback: it pins python_version 3.12, under which mypy cannot
      # parse Home Assistant's own 3.14 source and stops before reaching this
      # integration, and it silences the HA-facing modules by name.
      - name: mypy strict, all modules
        timeout-minutes: 15
        run: .venv/bin/python -m mypy --config-file mypy-full.ini custom_components/base_power
