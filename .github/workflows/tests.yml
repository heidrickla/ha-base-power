name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Gitea's act_runner also picks up .github/workflows, so every job is gated to
# GitHub.
#
# Two environments on purpose. The pure suite runs with NO Home Assistant
# installed, which is the check: if an HA import reaches api.py or clerk.py it
# stops collecting and says so. A single environment would hide that.
jobs:
  pure:
    if: github.server_url == 'https://github.com'
    name: Parsing layer, without Home Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pytest-asyncio ruff

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Pure tests
        run: python -m pytest tests -q

      - name: Offline validator
        run: python tools/validate_local.py

  home-assistant:
    if: github.server_url == 'https://github.com'
    name: Home Assistant layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.14 is required, not preferred. Every
      # pytest-homeassistant-custom-component from 0.13.317 needs >=3.14, and
      # on 3.13 pip resolves an OLD Home Assistant instead of refusing, so the
      # suite goes green against a version nobody runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            "pytest-homeassistant-custom-component==0.13.365" \
            "mypy==1.18.2"

      - name: Full suite with coverage
        run: |
          python -m pytest tests -q \
            --cov=custom_components/base_power \
            --cov-report=term-missing --cov-fail-under=95

      # mypy-full.ini, not pyproject's [tool.mypy]. That section is the
      # Windows fallback: it pins python_version 3.12, under which mypy cannot
      # parse Home Assistant's own 3.14 source and stops before reaching this
      # integration, and it silences the HA-facing modules by name.
      - name: mypy strict, all modules
        run: python -m mypy --config-file mypy-full.ini custom_components/base_power
