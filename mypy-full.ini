# The real type check: all 11 modules, with Home Assistant installed.
#
#     mypy --config-file mypy-full.ini custom_components/base_power
#
# Separate from pyproject.toml's [tool.mypy] on purpose. That section is the
# fallback for a host where Home Assistant cannot be installed, and it pins
# python_version 3.12 and silences the HA-facing modules by name. Running the
# full check under it does not merely check less: mypy fails parsing Home
# Assistant's own source, which uses 3.14 syntax, and stops before reaching
# this integration at all.
[mypy]
python_version = 3.14
strict = True
